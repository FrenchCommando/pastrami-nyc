<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pile it high — pastrami.nyc</title>
<meta name="description" content="Stack pastrami on rye. How high can you pile it?">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥪</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Courier+Prime:wght@400;700&family=Libre+Franklin:wght@400;600;800&family=Yellowtail&display=swap" rel="stylesheet">
<style>
  :root {
    --mustard: #e3a91c;
    --deli-red: #b3262f;
    --ink: #2a1712;
    --paper: #fbf6ea;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  body {
    background-color: #f4efe4;
    background-image:
      linear-gradient(#e2dccd 1px, transparent 1px),
      linear-gradient(90deg, #e2dccd 1px, transparent 1px);
    background-size: 64px 32px, 64px 32px;
    background-position: 0 0, 32px 0;
  }
  body::after {
    /* counter stripe */
    content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: 56px;
    background: repeating-linear-gradient(90deg, #2d2d2d 0 40px, #f2f2f2 40px 80px);
    border-top: 6px solid #7a4a24;
    z-index: -1;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  header {
    position: fixed; top: 14px; left: 0; right: 0; text-align: center; pointer-events: none;
  }
  .sign {
    display: inline-block;
    font-family: "Yellowtail", cursive;
    font-size: clamp(28px, 6vw, 46px);
    color: #fff4f0;
    text-shadow: 0 0 4px #ff5a5a, 0 0 12px #ff2a2a, 0 0 24px #d10000;
    letter-spacing: 1px;
    animation: flicker 7s infinite;
  }
  @keyframes flicker {
    0%, 92%, 94%, 100% { opacity: 1; }
    93% { opacity: .55; }
  }
  .home {
    position: fixed; top: 14px; left: 16px; z-index: 2;
    font-weight: 800; font-size: 14px; color: var(--ink); text-decoration: none;
    background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 6px 12px;
  }
  .home:hover { background: var(--mustard); }
  #score {
    margin-top: 4px;
    font-family: "Alfa Slab One", Georgia, serif;
    font-size: clamp(42px, 10vw, 72px);
    color: var(--ink);
    text-shadow: 3px 3px 0 var(--mustard);
    line-height: 1;
  }
  #sub { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; opacity: .6; }

  .overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .card {
    pointer-events: auto;
    background: var(--paper);
    width: min(320px, 86vw);
    padding: 22px 22px 18px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    position: relative;
    font-family: "Courier Prime", "Courier New", monospace;
  }
  /* torn ticket edges */
  .card::before, .card::after {
    content: ""; position: absolute; left: 0; right: 0; height: 10px;
    background: radial-gradient(circle at 5px -1px, transparent 6px, var(--paper) 6.5px) repeat-x;
    background-size: 10px 10px;
  }
  .card::before { top: -10px; transform: rotate(180deg); }
  .card::after { bottom: -10px; }
  .card h1 {
    font-family: "Alfa Slab One", Georgia, serif; font-weight: 400; margin: 0 0 6px; font-size: 26px; color: var(--deli-red);
  }
  .card p { margin: 8px 0; font-size: 14px; line-height: 1.45; }
  .ticket-num {
    font-family: "Alfa Slab One", Georgia, serif; font-weight: 400;
    font-size: 64px; color: var(--deli-red); line-height: 1; margin: 6px 0;
  }
  .ticket-label { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; }
  .verdict { font-weight: bold; font-size: 15px; }
  .stats { border-top: 1px dashed #b9ad94; border-bottom: 1px dashed #b9ad94; padding: 8px 0; margin: 12px 0; font-size: 13px; }
  .stats div { display: flex; justify-content: space-between; }
  button {
    font: inherit; font-weight: bold; font-size: 16px;
    background: var(--mustard); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 10px 26px; margin-top: 6px; cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
  }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .hidden { display: none; }
  .hint { font-size: 12px; opacity: .6; margin-top: 10px; }
</style>
<script type="module" src="game.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<a class="home" href="/">← pastrami.nyc</a>

<header>
  <div class="sign">pastrami.nyc</div>
  <div id="score" class="hidden">0</div>
  <div id="sub" class="hidden">slices</div>
</header>

<div class="overlay" id="start">
  <div class="card">
    <h1>Pile it high.</h1>
    <p>The slicer swings. You drop. Whatever hangs off the edge hits the floor.</p>
    <p>Line them up perfectly and the counterman cuts you a little extra.</p>
    <button id="startBtn">Start slicing</button>
    <div class="hint">tap · click · space</div>
  </div>
</div>

<div class="overlay hidden" id="over">
  <div class="card">
    <div class="ticket-label">now serving</div>
    <div class="ticket-num" id="finalScore">0</div>
    <p class="verdict" id="verdict"></p>
    <div class="stats">
      <div><span>Pile height</span><span id="inches"></span></div>
      <div><span>Meat</span><span id="weight"></span></div>
      <div><span>Perfect cuts</span><span id="perfects"></span></div>
      <div><span>Best ever</span><span id="best"></span></div>
    </div>
    <button id="againBtn">Another one</button>
    <div class="hint">mustard is on the table</div>
  </div>
</div>
</body>
</html>
