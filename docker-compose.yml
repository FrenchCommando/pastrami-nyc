name: pastrami

# Static site in a read-only nginx:alpine container, published on loopback only.
# The host nginx (deploy/edge-pastrami.conf) terminates TLS for pastrami.nyc
# and proxies here. Deployed by FrenchCommando/pi-deploy on push to main.

services:
  pastrami:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: pastrami:latest
    container_name: pastrami
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:3030:80"
