# Host nginx server block. On the Pi:
#
#   sudo cp deploy/edge-pastrami.conf /etc/nginx/sites-available/pastrami.conf
#   sudo ln -s /etc/nginx/sites-available/pastrami.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pastrami.nyc
#
# certbot adds the 443 listener and the http->https redirect.
# The container publishes 127.0.0.1:3030 (see docker-compose.yml).

server {
    listen 80;
    server_name pastrami.nyc;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
