# Inner tier: serves the static site. TLS terminates at the edge.
# App files aren't fingerprinted -> always revalidate (cheap 304s via ETag).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control "no-cache" always;
    # Fonts come from Google Fonts: stylesheet from fonts.googleapis.com, files from fonts.gstatic.com.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { try_files $uri $uri/ =404; }
}
